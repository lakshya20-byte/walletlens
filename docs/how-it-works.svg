<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 270" width="940" height="270" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">How WalletLens works</title>
  <desc id="d">A wallet address is read through Envio HyperSync, active approvals are grouped by spender by a rule engine, and each finding links to its on-chain transaction.</desc>
  <style>
    .t{font:600 15px system-ui,"Segoe UI",Roboto,sans-serif;fill:#ece9f6;text-anchor:middle}
    .s{font:12px system-ui,"Segoe UI",Roboto,sans-serif;fill:#9a95b0;text-anchor:middle}
    .h{font:600 13px system-ui,"Segoe UI",Roboto,sans-serif;fill:#c4b5fd;text-anchor:middle}
    .node{fill:#15112a;stroke:#3b2f6b;stroke-width:1.5;animation:pulse 6s ease-in-out infinite}
    .n2{animation-delay:1.5s}.n3{animation-delay:3s}.n4{animation-delay:4.5s}
    .arrow{stroke:#8b5cf6;stroke-width:2.5;fill:none;stroke-dasharray:8 8;animation:flow 1s linear infinite}
    @keyframes flow{to{stroke-dashoffset:-16}}
    @keyframes pulse{0%{stroke:#3b2f6b;stroke-width:1.5}6%{stroke:#c4b5fd;stroke-width:3}22%{stroke:#3b2f6b;stroke-width:1.5}100%{stroke:#3b2f6b;stroke-width:1.5}}
    @media (prefers-reduced-motion:reduce){.node,.arrow{animation:none}}
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#8b5cf6"/>
    </marker>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b5cf6"/><stop offset="1" stop-color="#f43f5e"/>
    </linearGradient>
  </defs>

  <rect width="940" height="270" rx="18" fill="#0b0914"/>

  <rect class="node" x="30" y="40" width="170" height="92" rx="14"/>
  <text class="t" x="115" y="82">Wallet address</text>
  <text class="s" x="115" y="104">paste any Monad address</text>

  <rect class="node n2" x="265" y="40" width="170" height="92" rx="14"/>
  <text class="t" x="350" y="82">Envio HyperSync</text>
  <text class="s" x="350" y="104">full approval history</text>

  <rect class="node n3" x="500" y="40" width="170" height="92" rx="14"/>
  <text class="t" x="585" y="82">Rule engine</text>
  <text class="s" x="585" y="104">grouped by spender</text>

  <rect class="node n4" x="735" y="40" width="170" height="92" rx="14"/>
  <text class="t" x="820" y="82">Findings + proof</text>
  <text class="s" x="820" y="104">each links to its tx</text>

  <path class="arrow" d="M204 86H259" marker-end="url(#ah)"/>
  <path class="arrow" d="M439 86H494" marker-end="url(#ah)"/>
  <path class="arrow" d="M674 86H729" marker-end="url(#ah)"/>

  <rect x="30" y="166" width="875" height="3" rx="1.5" fill="url(#bar)" opacity="0.7"/>
  <text class="h" x="470" y="196">Pre-sign check API: spender address, then contract code?, then verdict (warn / review / no_flag)</text>
  <text class="s" x="470" y="226">Read-only. Never asks for keys or signatures. Never says a wallet is "safe".</text>
</svg>
